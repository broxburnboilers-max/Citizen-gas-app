    <style>
      #cg-sent-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: #18252D;
        color: #f5f5f5;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 24px;
      }
      #cg-sent-overlay.show { display: flex; }
      #cg-sent-overlay .tick {
        width: 96px; height: 96px; border-radius: 50%;
        background: #F2682A;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 8px 32px rgba(242,104,42,0.35);
      }
      #cg-sent-overlay .tick svg { width: 56px; height: 56px; stroke: #fff; stroke-width: 4; fill: none; }
      #cg-sent-overlay h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
      #cg-sent-overlay p { font-size: 16px; color: #b8c2c8; margin: 0 0 32px; max-width: 320px; line-height: 1.5; }
      #cg-sent-overlay button {
        background: #F2682A; color: #fff; border: 0;
        padding: 14px 36px; border-radius: 12px; font-size: 16px; font-weight: 700;
        cursor: pointer; min-width: 180px;
      }
      #cg-sent-overlay button:active { transform: scale(0.98); }
    </style>

  <body>
    <div id="root"></div>

    <!-- Sent confirmation overlay (engineer's end-of-flow) -->
    <div id="cg-sent-overlay" role="dialog" aria-live="polite">
      <div class="tick">
        <svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,7" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </div>
      <h1>Sent</h1>
      <p>Visit data has been saved. Thank you.</p>
      <button id="cg-sent-done" type="button">Done</button>
    </div>

    <script>
    (function () {
      var overlay = document.getElementById("cg-sent-overlay");
      var doneBtn = document.getElementById("cg-sent-done");

      window.addEventListener("citizenGas:queued", function () {
        overlay.classList.add("show");
      });

      doneBtn.addEventListener("click", function () {
        overlay.classList.remove("show");
        // Reset run-through: clear in-app state and bounce home.
        try {
          // Citizen Gas stores wizard state under "citizenGas." prefixed keys; nuke transient ones
          // but keep engineer profile & queue.
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf("citizenGas.") === 0
              && k !== "citizenGas.engineerProfile"
              && k !== "citizenGas.queue") {
              localStorage.removeItem(k);
            }
          });
        } catch (e) {}
        // Hard navigate so React re-mounts cleanly.
        window.location.href = "/";
      });

      // ── Long-press Citizen Gas logo / header → admin entry to dashboard ──
      // Inject CSS that disables the browser's native image callout / context menu
      // / text-selection on any element we tag for long-press. Without this, mobile
      // Chrome shows its own "Open image / Copy image" sheet before our timer fires.
      (function injectCss() {
        var s = document.createElement("style");
        s.textContent = '[data-cg-lp]{ -webkit-touch-callout:none !important; -webkit-user-select:none !important; user-select:none !important; -webkit-user-drag:none !important; -webkit-tap-highlight-color:transparent; touch-action:manipulation; pointer-events:auto; }';
        document.head.appendChild(s);
      })();

      var pressTimer = null;
      var pressFired = false;
      var PRESS_MS = 1500;

      function startPress(e) {
        clearTimeout(pressTimer);
        pressFired = false;
        pressTimer = setTimeout(function () {
          pressFired = true;
          try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
          window.location.href = "/dashboard/?admin=1";
        }, PRESS_MS);
      }
      function endPress() { clearTimeout(pressTimer); pressTimer = null; }
      function killCtx(e) { e.preventDefault(); return false; }

      function bindOne(el) {
        if (!el || el.dataset.cgLpBound) return;
        el.dataset.cgLpBound = "1";
        el.setAttribute("data-cg-lp", "1");
        // Belt-and-braces: disable the native image callout via attributes too.
        el.setAttribute("draggable", "false");
        if (el.tagName === "IMG") {
          el.style.webkitTouchCallout = "none";
          el.style.webkitUserSelect = "none";
          el.style.userSelect = "none";
        }
        el.addEventListener("touchstart", startPress, { passive: true });
        el.addEventListener("touchend", endPress, { passive: true });
        el.addEventListener("touchcancel", endPress, { passive: true });
        el.addEventListener("touchmove", endPress, { passive: true });
        el.addEventListener("mousedown", startPress);
        el.addEventListener("mouseup", endPress);
        el.addEventListener("mouseleave", endPress);
        el.addEventListener("contextmenu", killCtx);
        el.addEventListener("dragstart", killCtx);
      }

      function bindLogoLongPress() {
        // 1) The logo image (alt="Citizen Gas")
        document.querySelectorAll('img[alt="Citizen Gas"]').forEach(bindOne);
        // 2) Any heading whose text is exactly "Citizen Gas" (h1/h2/header brand)
        document.querySelectorAll("h1,h2,h3").forEach(function (h) {
          if ((h.textContent || "").trim().toLowerCase() === "citizen gas") bindOne(h);
        });
        // 3) Any element explicitly tagged by the bundle as the brand wrapper
        document.querySelectorAll('[data-cg-brand]').forEach(bindOne);
      }

      // Re-bind whenever DOM changes (React re-renders).
      var mo = new MutationObserver(bindLogoLongPress);
      window.addEventListener("DOMContentLoaded", function () {
        bindLogoLongPress();
        mo.observe(document.body, { childList: true, subtree: true });
      });

      // Global safety net: if the user long-presses anywhere within the top 25% of
      // the screen on the engineer sign-in page (where the logo lives) we still trigger.
      // This survives even if React replaces the logo node mid-press.
      (function topZoneFallback() {
        var zoneTimer = null;
        function inLogoZone(touch) {
          var y = (touch.clientY != null ? touch.clientY : touch.pageY);
          return y > 0 && y < (window.innerHeight * 0.28);
        }
        document.addEventListener("touchstart", function (ev) {
          if (!ev.touches || !ev.touches.length) return;
          if (!inLogoZone(ev.touches[0])) return;
          // Only arm fallback when no specific bound element handled it.
          if (ev.target && ev.target.closest && ev.target.closest('[data-cg-lp]')) return;
          // Engineer sign-in page only (no /dashboard/)
          if (location.pathname.indexOf("/dashboard") === 0) return;
          clearTimeout(zoneTimer);
          zoneTimer = setTimeout(function () {
            try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
            window.location.href = "/dashboard/?admin=1";
          }, PRESS_MS);
        }, { passive: true });
        ["touchend","touchcancel","touchmove","scroll"].forEach(function (evt) {
          document.addEventListener(evt, function () { clearTimeout(zoneTimer); zoneTimer = null; }, { passive: true });
        });
      })();
    })();
    </script>
  </body>
